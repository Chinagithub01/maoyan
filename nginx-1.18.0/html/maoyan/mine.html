<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 - 猫眼演出</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="container topbar-inner">
        <select class="city-select" v-model="cityId" aria-label="城市">
          <option v-for="city in cities" :key="city.id" :value="String(city.id)">{{ city.name }}</option>
        </select>
        <div class="topbar-links">
          <template v-if="session">
            <span class="nick">{{ nickname }}</span>
            <button type="button" class="linkish" @click="logout">退出</button>
          </template>
          <template v-else>
            <a href="login.html?redirect=mine.html">登录</a>
            <a href="login.html?tab=register&redirect=mine.html">注册</a>
          </template>
        </div>
      </div>
    </div>
    <header class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="index.html"><span class="logo-mark">猫</span><span>猫眼演出</span></a>
        <nav class="nav">
          <a href="index.html">首页</a>
          <a class="active" href="mine.html">我的</a>
        </nav>
      </div>
    </header>
    <main class="container block page">
      <div class="block-head"><h1>我的</h1></div>
      <section v-if="!session" class="panel mine-card">
        <h2>未登录</h2>
        <p>登录后可以查看订单。</p>
        <div class="banner-actions">
          <a class="buy" href="login.html?redirect=mine.html">登录</a>
          <a class="buy ghost" href="login.html?tab=register&redirect=mine.html">注册</a>
        </div>
      </section>
      <template v-else>
        <section class="panel mine-card">
          <h2>{{ nickname }}</h2>
          <p class="meta">用户名 {{ session.username }}<span v-if="session.phone"> · {{ session.phone }}</span></p>
        </section>
        <p v-if="error" class="empty">{{ error }}</p>
        <p v-else-if="loading" class="meta">正在加载订单</p>
        <p v-else-if="!orders.length" class="empty">还没有订单，<a href="index.html">去首页看看</a></p>
        <div v-else class="ticket-list">
          <article class="ticket-card" v-for="order in orders" :key="order.orderNo">
            <div class="ticket-main">
              <h3>{{ order.showName }}</h3>
              <p>{{ order.venueName }}</p>
              <p>{{ formatTime(order.showTime) }} · {{ order.priceTierName }}</p>
              <p>座位：{{ seats(order) }}</p>
              <p class="meta">{{ order.quantity }} 张 · 订单号 {{ order.orderNo }}</p>
            </div>
            <div class="ticket-stub">
              <span class="price">{{ money(order.totalPrice) }}</span>
              <span class="status" :class="order.status === 2 ? 'back' : 'done'">{{ statusText(order.status) }}</span>
              <button v-if="order.refundEnabled === 1 && order.status === 1" type="button" class="buy ghost" @click="refund(order)">
                {{ order.confirming ? "确认退票" : "退票" }}
              </button>
            </div>
          </article>
        </div>
        <p v-if="message" class="msg">{{ message }}</p>
      </template>
    </main>
    <footer class="footer">
      <div class="container">
        <p>猫眼演出</p>
        <p>订单来自数据库。</p>
      </div>
    </footer>
  </div>
  <script src="js/vue.global.prod.js"></script>
  <script src="js/mine.js"></script>
</body>
</html>

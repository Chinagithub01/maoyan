<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 猫眼演出</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="header"></div>
  <main class="auth-wrap">
    <section class="auth-card" id="auth-card">
      <div class="tabs" id="auth-tabs">
        <button type="button" data-tab="login">登录</button>
        <button type="button" data-tab="register">注册</button>
      </div>
      <form id="login-form">
        <h1>登录</h1>
        <label class="field"><span>用户名</span><input name="username" maxlength="20" autocomplete="username" required></label>
        <label class="field"><span>密码</span><input name="password" type="password" maxlength="100" autocomplete="current-password" required></label>
        <button class="full-btn" type="submit">登录</button>
      </form>
      <form id="register-form" hidden>
        <h1>注册</h1>
        <label class="field"><span>用户名</span><input name="username" minlength="2" maxlength="20" autocomplete="username" required></label>
        <label class="field"><span>密码</span><input name="password" type="password" minlength="6" maxlength="100" autocomplete="new-password" required></label>
        <label class="field"><span>手机号</span><input name="phone" type="tel" maxlength="11" autocomplete="tel" required></label>
        <label class="field"><span>昵称</span><input name="nickname" maxlength="50" autocomplete="nickname"></label>
        <button class="full-btn" type="submit">注册并登录</button>
      </form>
      <p class="msg" id="auth-msg"></p>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
